name: CI

# Гейт якості: ганяємо перевірку типів і тести на кожен PR та push у main.
# Деплой (deploy.yml) лишається окремо й спрацьовує лише на push у main.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

# Скасовуємо застарілі прогони для тієї самої гілки/PR — бережемо черги.
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
