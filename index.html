<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: колір системного UI; маніфест інжектує vite-plugin-pwa при білді. -->
    <meta name="theme-color" content="#4f46e5" />
    <title>Алгоритми: інтерактивні розбори</title>
    <meta
      name="description"
      content="Інтерактивна платформа для вивчення алгоритмів: теорія, редактор графа, покрокове програвання та бенчмарк. Перший розділ — алгоритм Краскала (МОД)."
    />
    <link rel="canonical" href="https://marynashavlak.github.io/kruskal-mst-visualizer/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (соцпрев'ю) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Алгоритми: інтерактивні розбори" />
    <meta property="og:title" content="Алгоритми: інтерактивні розбори" />
    <meta
      property="og:description"
      content="Інтерактивна платформа для вивчення алгоритмів: теорія, редактор, покрокове програвання та бенчмарк. 20 алгоритмів — графи, динамічне програмування, сортування, пошук і пошук у рядку."
    />
    <meta property="og:url" content="https://marynashavlak.github.io/kruskal-mst-visualizer/" />
    <meta
      property="og:image"
      content="https://marynashavlak.github.io/kruskal-mst-visualizer/favicon.svg"
    />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Алгоритми: інтерактивні розбори" />
    <meta
      name="twitter:description"
      content="Інтерактивна платформа для вивчення алгоритмів: теорія, редактор, покрокове програвання та бенчмарк."
    />
    <meta
      name="twitter:image"
      content="https://marynashavlak.github.io/kruskal-mst-visualizer/favicon.svg"
    />
    <script>
      // Застосувати тему до першого рендеру (без миготіння).
      (function () {
        try {
          var t = localStorage.getItem("kruskal-theme")
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
