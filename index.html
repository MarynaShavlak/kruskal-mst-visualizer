<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Алгоритми: інтерактивні розбори</title>
    <meta
      name="description"
      content="Інтерактивна платформа для вивчення алгоритмів: теорія, редактор графа, покрокове програвання та бенчмарк. Перший розділ — алгоритм Краскала (МОД)."
    />
    <script>
      // Застосувати тему до першого рендеру (без миготіння).
      (function () {
        try {
          var t = localStorage.getItem("kruskal-theme")
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
