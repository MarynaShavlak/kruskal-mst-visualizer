<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Візуалізатор алгоритму Краскала (МОД)</title>
    <meta
      name="description"
      content="Інтерактивний навчальний застосунок про алгоритм Краскала та мінімальне остовне дерево."
    />
    <script>
      // Застосувати тему до першого рендеру (без миготіння).
      (function () {
        try {
          var t = localStorage.getItem("kruskal-theme") || "system"
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
