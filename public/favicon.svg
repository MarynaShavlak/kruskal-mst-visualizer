<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Граф (мінімальне остовне дерево)">
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>
  <!-- відкинуте ребро (цикл) -->
  <line x1="9" y1="11" x2="23" y2="11" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <!-- ребра остовного дерева -->
  <line x1="9" y1="11" x2="16" y2="23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="23" y1="11" x2="16" y2="23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- вершини -->
  <circle cx="9" cy="11" r="3.5" fill="#ffffff"/>
  <circle cx="23" cy="11" r="3.5" fill="#ffffff"/>
  <circle cx="16" cy="23" r="3.5" fill="#ffffff"/>
</svg>
